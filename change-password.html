<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="COMP307 project blossom app">
    <meta name="description" content="COMP 307 Project: Blossom Change Password">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Blossom - Change Password</title>
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/change-password.css">
</head>

<body>
<div class="app">

    <!-- Header with Blossom logo and nickname/avatar -->
    <header class="header">

        <!-- Blossom logo -->
        <img id="logo"  src="assets/icons/logo.png" class="logo" alt="Blossom">

        <!-- Nickname and avatar -->
        <div class="user">
            <span id="nickname" class="nickname">@Nickname</span>
            <img id="avatar" src="assets/icons/avatar.png" class="avatar" alt="Profile">
        </div>

    </header>

    <!-- Page -->
    <main class="pages">

        <!-- SETTINGS -->
        <section id="page-settings" class="page active">

            <!-- Go back to settings -->
            <a class="back-link" href="settings.html">Settings</a>

            <!-- Change password form -->
            <form id="password-form" class="password-form" novalidate>

                <!-- Form title -->
                <h1 class="form-title"> Change Password</h1>

                <!-- Current password -->
                <label class="field">
                    <span class="field-label">Current password</span>
                    <input type="password" id="current-password" autocomplete="current-password" required>
                </label>

                <!-- New password -->
                <label class="field">
                    <span class="field-label">New password</span>
                    <input type="password" id="new-password" autocomplete="new-password" required>
                </label>

                <!-- Confirm new password -->
                <label class="field">
                    <span class="field-label">Confirm new password</span>
                    <input type="password" id="confirm-password" autocomplete="new-password" required>
                </label>

                <!-- Error or success message -->
                <p id="message" class="form-message" role="alert"></p>

                <!-- Submit button to save new password -->
                <button type="submit" id="save" class="save-button">Save Password</button>

            </form>

        </section>

    </main>

    <!-- Navigation bar -->
    <nav class="navbar">

        <!-- Home button -->
        <a class="nav-btn" href="homepage.html" aria-label="Home">
            <img class="nav-icon" src="assets/icons/home.svg" alt="">
            <span class="nav-label">Dashboard</span>
        </a>

        <!-- Habits button -->
        <a class="nav-btn" href="habits.html" aria-label="Habits">
            <img class="nav-icon" src="assets/icons/check-circle.svg" alt="">
            <span class="nav-label">Habits</span>
        </a>

        <!-- Calendar button -->
        <a class="nav-btn" href="calendar.html" aria-label="Calendar">
            <img class="nav-icon" src="assets/icons/calendar.svg" alt="">
            <span class="nav-label">Calendar</span>
        </a>

        <!-- Settings button -->
        <a class="nav-btn active" href="settings.html" aria-label="Settings">
            <img class="nav-icon" src="assets/icons/settings.svg" alt="">
            <span class="nav-label">Settings</span>
        </a>

    </nav>

</div>

<!-- JavaScript for Change Password page -->
<script src="js/change-password.js"></script>

</body>
</html>
