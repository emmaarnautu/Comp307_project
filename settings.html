<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="COMP307 project blossom app">
    <meta name="description" content="COMP 307 Project: Blossom Settings">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Blossom - Settings</title>
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <div class="app">

    <!-- Header with Blossom logo and nickname/avatar -->
    <header class="header">

        <!-- Blossom logo -->
        <img id="logo"  src="assets/icons/logo.png" class="logo" alt="Blossom">

        <!-- Nickname and avatar -->
        <div class="user">
            <span id="nickname" class="nickname">@Nickname</span>
            <img id="avatar" src="assets/icons/avatar.png" class="avatar" alt="Profile">
        </div>

    </header>

    <!-- Page -->
    <main class="pages">

        <!-- SETTINGS -->
        <section id="page-settings" class="page active">

            <div class="settings-list">
                <!-- Title -->
                <h1 class="settings-title">Settings</h1>

                <!-- Change password -->
                <a class="setting-row" href="change-password.html">
                    <img class="setting-icon" src="assets/icons/lock.svg" alt="">
                    <span class="setting-label">Change Password</span>
                </a>

                <!-- Logout -->
                <button class="setting-row" id="logout" type="button">
                    <img class="setting-icon" src="assets/icons/log-out.svg" alt="">
                    <span class="setting-label">Log Out</span>
                </button>

            </div>

        </section>

    </main>

    <!-- Navigation bar -->
    <nav class="navbar">

        <!-- Home button -->
        <a class="nav-btn" href="homepage.html" aria-label="Home">
            <img class="nav-icon" src="assets/icons/home.svg" alt="">
            <span class="nav-label">Dashboard</span>
        </a>

        <!-- Habits button -->
        <a class="nav-btn" href="habits.html" aria-label="Habits">
            <img class="nav-icon" src="assets/icons/check-circle.svg" alt="">
            <span class="nav-label">Habits</span>
        </a>

        <!-- Calendar button -->
        <a class="nav-btn" href="calendar.html" aria-label="Calendar">
            <img class="nav-icon" src="assets/icons/calendar.svg" alt="">
            <span class="nav-label">Calendar</span>
        </a>

        <!-- Settings button -->
        <a class="nav-btn active" href="settings.html" aria-label="Settings">
            <img class="nav-icon" src="assets/icons/settings.svg" alt="">
            <span class="nav-label">Settings</span>
        </a>

    </nav>

    </div>

    <!-- JavaScript for Settings page -->
    <script src="js/settings.js"></script>

</body>
</html>
