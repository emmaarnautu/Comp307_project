
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blossom</title>
</head>
<body>
    <h2>Login to Blossom</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <button type="button" id="forgotPassword">Forgot password</button>
    </form>
    <form id="forgotForm" hidden>
        <h3>Forgot password</h3>
        <input type="email" id="resetEmail" placeholder="Email" required>
        <button type="submit">Send code</button>
    </form>
    <form id="resetForm" hidden>
        <h3>Reset password</h3>
        <input type="text" id="code" placeholder="Verification code" maxlength="6" required>
        <input type="password" id="newPassword" placeholder="New password" minlength="8" required>
        <button type="submit">Reset password</button>
    </form>
    <p id="message"></p>
    <a href="login.html">Back to login</a>
    <a href="register.html">Register</a>
    <script src="js/login.js"></script>
</body>
</html>
