
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blossom Backend Testing</title>
</head>
<body>

<h1>Blossom Backend Testing</h1>

<h2>Register</h2>
<form id="registerForm">
    <input name="first_name" placeholder="First name" required>
    <input name="last_name" placeholder="Last name" required>
    <input name="username" placeholder="Username" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required minlength="8">
    <button type="submit">Register</button>
</form>

<h2>Verify Email</h2>
<form id="verifyForm">
    <input name="email" type="email" placeholder="Email" required>
    <input name="code" placeholder="6-digit code" required>
    <button type="submit">Verify Email</button>
</form>

<h2>Resend Verification Code</h2>
<form id="resendForm">
    <input name="email" type="email" placeholder="Email" required>
    <button type="submit">Resend Code</button>
</form>

<h2>Login</h2>
<form id="loginForm">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<h2>Ticket</h2>
<button type="button" onclick="checkTicket()">Check Ticket</button>
<button type="button" onclick="logout()">Logout</button>
<p>Stored ticket: <span id="ticketDisplay">None</span></p>

<h2>Forgot Password</h2>
<form id="forgotForm">
    <input name="email" type="email" placeholder="Email" required>
    <button type="submit">Send Reset Code</button>
</form>

<h2>Reset Password</h2>
<form id="resetForm">
    <input name="email" type="email" placeholder="Email" required>
    <input name="code" placeholder="Reset code" required>
    <input name="new_password" type="password" placeholder="New password" required minlength="8">
    <button type="submit">Reset Password</button>
</form>

<h2>Change Password</h2>
<form id="changePasswordForm">
    <input name="current_password" type="password" placeholder="Current password" required>
    <input name="new_password" type="password" placeholder="New password" required minlength="8">
    <button type="submit">Change Password</button>
</form>

<h2>Weather</h2>

<button type="button" onclick="updateLocation()">
    Update Browser Location
</button>

<button type="button" onclick="getWeather()">
    Get Today's Weather
</button>

<p>Location status: <span id="locationDisplay">Not requested</span></p>

<h3>Historical Weather</h3>
<form id="weatherForm">
    <input name="date" type="date" required>
    <button type="submit">Get Weather by Date</button>
</form>

<h2>Response</h2>
<pre id="output"></pre>

<script>
    // Get the HTML elements where we display responses,
    // ticket status and location status
    const output = document.getElementById("output");
    const ticketDisplay = document.getElementById("ticketDisplay");
    const locationDisplay = document.getElementById("locationDisplay");


    // ========================================
    // REGISTRATION
    // ========================================

    // Gets first name, last name, username, email and password
    // from the registration form
    document.getElementById("registerForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "register");

        const response = await fetch("php/register.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show registration response
        output.textContent = JSON.stringify(result, null, 2);
    };


    // ========================================
    // EMAIL VERIFICATION
    // ========================================

    // Gets email and verification code from the form
    document.getElementById("verifyForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "verify");

        const response = await fetch("php/register.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show verification response
        output.textContent = JSON.stringify(result, null, 2);
    };


    // Gets email from the form
    document.getElementById("resendForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "resend");

        const response = await fetch("php/register.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show resend response
        output.textContent = JSON.stringify(result, null, 2);
    };


    // ========================================
    // LOGIN
    // ========================================

    // Gets email and password from the form
    // Receives a ticket if login is successful
    // Saves the ticket and requests browser location
    document.getElementById("loginForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "login");

        const response = await fetch("php/login.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show response without exposing ticket
        output.textContent = JSON.stringify({
            success: result.success,
            message: result.message
        }, null, 2);

        if (result.success && result.ticket) {
            localStorage.setItem("ticket", result.ticket);

            // Update ticket status
            showTicket();

            // Request browser location after successful login
            updateLocation();
        }
    };


    // ========================================
    // FORGOT PASSWORD
    // ========================================

    // Gets email from the form
    document.getElementById("forgotForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "forgot_password");

        const response = await fetch("php/register.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show forgot password response
        output.textContent = JSON.stringify(result, null, 2);
    };


    // ========================================
    // RESET PASSWORD
    // ========================================

    // Gets email, reset code and new password from the form
    document.getElementById("resetForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "reset_password");

        const response = await fetch("php/register.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show password reset response
        output.textContent = JSON.stringify(result, null, 2);

        if (result.success) {
            localStorage.removeItem("ticket");

            // Update ticket and location status
            showTicket();
            locationDisplay.textContent = "Not requested";
        }
    };


    // ========================================
    // CHANGE PASSWORD
    // ========================================

    // Gets current password and new password from the form
    // Also gets the login ticket from localStorage
    // Removes the ticket if successful
    document.getElementById("changePasswordForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        data.append("action", "change_password");
        data.append("ticket", localStorage.getItem("ticket") || "");

        const response = await fetch("php/register.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show password change response
        output.textContent = JSON.stringify(result, null, 2);

        if (result.success) {
            localStorage.removeItem("ticket");

            // Update ticket and location status
            showTicket();
            locationDisplay.textContent = "Not requested";
        }
    };


    // ========================================
    // CHECK TICKET
    // ========================================

    // Gets the saved ticket from localStorage
    async function checkTicket() {
        const ticket = localStorage.getItem("ticket");

        if (!ticket) {
            output.textContent = "No ticket stored";
            return;
        }

        const data = new FormData();
        data.append("action", "check");
        data.append("ticket", ticket);

        const response = await fetch("php/session.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show ticket validation response
        output.textContent = JSON.stringify(result, null, 2);
    }


    // ========================================
    // LOGOUT
    // ========================================

    // Gets the saved ticket from localStorage
    // Removes the local ticket after successful logout
    async function logout() {
        const ticket = localStorage.getItem("ticket");

        if (!ticket) {
            output.textContent = "No ticket stored";
            return;
        }

        const data = new FormData();
        data.append("action", "logout");
        data.append("ticket", ticket);

        const response = await fetch("php/login.php", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        // Show logout response
        output.textContent = JSON.stringify(result, null, 2);

        if (result.success) {
            localStorage.removeItem("ticket");

            // Update ticket and location status
            showTicket();
            locationDisplay.textContent = "Not requested";
        }
    }


    // ========================================
    // UPDATE LOCATION
    // ========================================

    // Gets the user's location directly from the browser
    // Sends latitude, longitude and ticket to weather.php
    // Called automatically after successful login
    function updateLocation() {
        const ticket = localStorage.getItem("ticket");

        if (!ticket) {
            output.textContent = "No ticket stored";
            return;
        }

        if (!navigator.geolocation) {
            locationDisplay.textContent = "Geolocation not supported";
            return;
        }

        locationDisplay.textContent = "Requesting location...";

        navigator.geolocation.getCurrentPosition(

            async function(position) {

                // Ignore location if the user has logged out
                // or switched accounts while waiting
                if (localStorage.getItem("ticket") !== ticket) {
                    return;
                }

                const data = new FormData();

                data.append("action", "set_location");
                data.append("ticket", ticket);
                data.append("latitude", position.coords.latitude);
                data.append("longitude", position.coords.longitude);

                try {
                    const response = await fetch("php/weather.php", {
                        method: "POST",
                        body: data
                    });

                    const result = await response.json();

                    if (localStorage.getItem("ticket") !== ticket) {
                        return;
                    }

                    // Show location and weather response
                    output.textContent = JSON.stringify(result, null, 2);

                    if (result.success) {
                        locationDisplay.textContent = "Location saved";
                    } else {
                        locationDisplay.textContent = "Location update failed";
                    }

                } catch (error) {
                    locationDisplay.textContent = "Request failed";
                    output.textContent = error.message;
                }
            },

            // Handles denied permission or unavailable location
            function(error) {
                if (localStorage.getItem("ticket") !== ticket) {
                    return;
                }

                locationDisplay.textContent = error.message;
            },

            {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }


    // ========================================
    // GET WEATHER
    // ========================================

    // Gets stored weather for today or a specified date
    // Does not request browser location
    async function getWeather(date = null) {
        const ticket = localStorage.getItem("ticket");

        if (!ticket) {
            output.textContent = "No ticket stored";
            return;
        }

        const data = new FormData();

        data.append("action", "get_weather");
        data.append("ticket", ticket);

        // Include date only when historical weather is requested
        if (date !== null) {
            data.append("date", date);
        }

        try {
            const response = await fetch("php/weather.php", {
                method: "POST",
                body: data
            });

            const result = await response.json();

            // Show weather response
            output.textContent = JSON.stringify(result, null, 2);

        } catch (error) {
            output.textContent = error.message;
        }
    }


    // ========================================
    // HISTORICAL WEATHER
    // ========================================

    // Gets the selected date from the historical weather form
    document.getElementById("weatherForm").onsubmit = async function(event) {
        event.preventDefault();

        const data = new FormData(this);
        const date = data.get("date");

        await getWeather(date);
    };


    // ========================================
    // TICKET STATUS
    // ========================================

    // Checks localStorage and displays "Stored" or "None"
    function showTicket() {
        if (localStorage.getItem("ticket")) {
            ticketDisplay.textContent = "Stored";
        } else {
            ticketDisplay.textContent = "None";
        }
    }

    // Show ticket status when page loads
    showTicket();

</script>

</body>
</html>
