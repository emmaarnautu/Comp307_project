<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="keywords" content="COMP307 project blossom app">
	<meta name="description" content="COMP 307 Project: Blossom Homepage">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Blossom - Home</title>
	<link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="app">

    <!-- Header with Blossom logo and nickname/avatar -->
    <header class="header">

        <!-- Blossom logo -->
        <img id="logo"  src="assets/icons/logo.png" class="logo" alt="Blossom">

        <!-- Nickname and avatar -->
        <div class="user">
            <span id="nickname" class="nickname">@Nickname</span>
            <img id="avatar" src="assets/icons/avatar.png" class="avatar" alt="Profile">
        </div>

    </header>

    <!-- Pages -->
    <main class="pages">

        <!-- HOME -->
        <section id="page-home" class="page active">

		    <!-- Weather -->
            <div class="weather" id="weather">
                <img id="weather-icon" src="assets/weathers/Clear.png" alt="Weather">
                <span id="weather-temp">17°C</span>
            </div>

		    <!-- Tree -->
            <div class="tree-wrap">
                <div class="tree-layers">
                    <img id="tree" class="tree" src="assets/treestage7.png" alt="Tree">
                </div>
            </div>

		    <!-- Panel for coins and streak -->
            <div class="panel">
                <div class="stats">

                    <!-- Coins -->
                    <div class="stat">
                        <img id="coin-icon" src="assets/icons/coinNoBlur.png" alt="Coins">
                        <span id="coins" class="stat-num">32</span>
                    </div>

                    <!-- Streak -->
                    <div class="stat">
                        <img id="flower-icon" src="assets/icons/happy-streak.png" alt="Streak">
                        <span id="streak" class="stat-num">4</span>
                    </div>

                </div>

			    <!-- Shop items -->
                <div id="shop" class="shop"></div>

            </div>

        </section>

    </main>

    <!-- Bottom navigation bar -->
    <nav class="navbar">

        <!-- Home button -->
        <a class="nav-btn active" href="index.html" aria-label="Home">
            <span class="nav-icon" style="--icon: url('assets/icons/home.svg')"></span>
            <span class="nav-label">Dashboard</span>
        </a>

        <!-- Habits button -->
        <a class="nav-btn" href="habits.html" aria-label="Habits">
            <span class="nav-icon" style="--icon: url('assets/icons/check-circle.svg')"></span>
            <span class="nav-label">Habits</span>
        </a>

        <!-- Calendar button -->
        <a class="nav-btn" href="calendar.html" aria-label="Calendar">
            <span class="nav-icon" style="--icon: url('assets/icons/calendar.svg')"></span>
            <span class="nav-label">Calendar</span>
        </a>

        <!-- Settings button -->
        <a class="nav-btn" href="settings.html" aria-label="Settings">
            <span class="nav-icon" style="--icon: url('assets/icons/settings.svg')"></span>
            <span class="nav-label">Settings</span>
        </a>

    </nav>

    </div>

    <script src="js/dashboard.js"></script>

</body>
</html>
